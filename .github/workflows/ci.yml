name: CI
on:
  pull_request:
  push:
    branches: [main]
env:
  CF_SEND_TELEMETRY: "false"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run --cwd worker deploy:dry
