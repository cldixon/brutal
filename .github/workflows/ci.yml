name: CI
on:
  pull_request:
  push:
    branches: [main]
env:
  CF_SEND_TELEMETRY: "false"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      - run: bun run --cwd site deploy:dry
      - run: bun run --cwd worker deploy:dry
      - run: bun run --cwd admin deploy:dry
      - run: bun run pack

  # After every green push to main, in the order they bind to each other: the landing page
  # (brutal-site), the app (brutal), then the operator's portal (brutal-admin, behind Cloudflare
  # Access). Without the repo secret CLOUDFLARE_API_TOKEN nothing deploys; without OPERATOR_EMAIL
  # the portal is skipped. Hosts and the mail address are in deploy.config.ts.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
    steps:
      - name: No token, no deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Not deploying. Add the CLOUDFLARE_API_TOKEN repo secret to deploy main."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: oven-sh/setup-bun@v2
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: bun install --frozen-lockfile
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: bun run build
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Landing page (brutal-site)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun run --cwd site deploy
      - name: App (brutal)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun run --cwd worker deploy
      - name: Operator's portal (brutal-admin)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.OPERATOR_EMAIL != ''
        run: bun run --cwd admin deploy
      - name: No OPERATOR_EMAIL, no portal
        if: env.CLOUDFLARE_API_TOKEN != '' && env.OPERATOR_EMAIL == ''
        run: echo "::notice::The operator's portal was not deployed. Add the OPERATOR_EMAIL repo secret."
