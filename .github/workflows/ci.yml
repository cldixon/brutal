name: CI
on:
  pull_request:
  push:
    branches: [main]
env:
  CF_SEND_TELEMETRY: "false"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      - run: bun run --cwd worker deploy:dry
      - run: bun run pack

  # The hosted app at brutal.cldixon.dev, after every green push to main. Without the repo secret
  # CLOUDFLARE_API_TOKEN it skips with a notice. BRUTAL_MAIL_FROM (a repo variable) turns on
  # sign-in mail once a sending domain is set up.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BRUTAL_MAIL_FROM: ${{ vars.BRUTAL_MAIL_FROM }}
    steps:
      - name: No token, no deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Not deploying. Add the CLOUDFLARE_API_TOKEN repo secret to deploy main."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: oven-sh/setup-bun@v2
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: bun install --frozen-lockfile
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: bun run build
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: bun run deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
