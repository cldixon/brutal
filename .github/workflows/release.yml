name: Release

# Push a tag matching worker/package.json's version (e.g. v0.1.0) to release @brutal-ai/server,
# @brutal-ai/schema, @brutal-ai/sdk and create-brutal-ai together. Owners' deploy folders depend
# on these; nothing here deploys anything.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # npm only to publish: trusted publishing (no token, with provenance) needs npm 11.5.1+.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile

      - name: Check the tag matches the version
        run: |
          version="v$(jq -r .version worker/package.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match worker/package.json ($version)"
            exit 1
          fi

      - run: bun test
      - run: bun run pack

      # Schema before the SDK that depends on it; each package on npmjs.com trusts this workflow.
      - name: Publish to npm
        run: |
          for pkg in brutal-ai-schema brutal-ai-sdk brutal-ai-server create-brutal-ai; do
            npm publish dist/$pkg-*.tgz --access public
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes
